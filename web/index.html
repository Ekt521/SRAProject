<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SRA 智能研究助手</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #18212b; }
    main { width: min(900px, calc(100% - 32px)); margin: 32px auto; }
    h1 { margin: 0 0 6px; font-size: 28px; } header p { margin: 0; color: #617080; }
    #messages { min-height: 420px; max-height: 65vh; overflow-y: auto; padding: 18px; background: white; border: 1px solid #d9e0e7; border-radius: 8px; }
    .message { white-space: pre-wrap; line-height: 1.6; margin: 0 0 16px; padding: 12px 14px; border-radius: 6px; }
    .user { margin-left: 12%; background: #e8f1ff; } .assistant { margin-right: 12%; background: #f1f3f5; }
    form { display: flex; gap: 10px; margin-top: 14px; } textarea { flex: 1; resize: vertical; min-height: 54px; border: 1px solid #b9c5d0; border-radius: 6px; padding: 12px; font: inherit; }
    button { border: 0; border-radius: 6px; padding: 0 22px; background: #1769e0; color: white; font-weight: 600; cursor: pointer; } button:disabled { opacity: .6; cursor: wait; }
    .status { font-size: 13px; color: #617080; margin-top: 8px; }
  </style>
</head>
<body><main>
  <header><h1>SRA 智能研究助手</h1><p>输入问题，调用本地知识库和 DeepSeek Agent。</p></header>
  <section id="messages" aria-live="polite"><div class="message assistant">你好，我可以根据项目知识库回答问题。</div></section>
  <form id="chat-form"><textarea id="message" placeholder="输入你的问题..." required maxlength="4000"></textarea><button id="send" type="submit">发送</button></form>
  <div class="status" id="status">正在检查服务状态...</div>
</main>
<script>
const messages = document.querySelector('#messages'), input = document.querySelector('#message'), button = document.querySelector('#send'), status = document.querySelector('#status');
function addMessage(kind, text) { const el = document.createElement('div'); el.className = 'message ' + kind; el.textContent = text; messages.appendChild(el); messages.scrollTop = messages.scrollHeight; }
fetch('/api/health').then(r => r.json()).then(x => { status.textContent = x.configured ? '服务已连接' : '服务已连接，但尚未配置 DEEPSEEK_API_KEY'; }).catch(() => { status.textContent = '无法连接后端服务'; });
document.querySelector('#chat-form').addEventListener('submit', async (event) => {
  event.preventDefault(); const text = input.value.trim(); if (!text) return; addMessage('user', text); input.value = ''; button.disabled = true; status.textContent = '正在思考...';
  try { const res = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: text}) }); const data = await res.json(); if (!res.ok) throw new Error(data.detail || '请求失败'); addMessage('assistant', data.response); status.textContent = '服务已连接'; }
  catch (err) { addMessage('assistant', '请求失败：' + err.message); status.textContent = '请求失败'; } finally { button.disabled = false; input.focus(); }
});
</script></body></html>
